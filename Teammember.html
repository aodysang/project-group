    <link rel="stylesheet" href="styles.css">

    <style>
      :root {
        --color-primary: #0d6efd;
        --color-text-main: #18181b;
        --color-text-muted: #52525b;
        --color-bg-body: #f8f9fa;
        --color-bg-card: #ffffff;
        --color-border: #e4e4e7;
      }

      /* โทน Dark Mode แบบ Minimalist Modern เข้าชุดกับหน้าหลัก */
      .dark-mode {
        --color-primary: #60a5fa;
        --color-text-main: #f4f4f5;
        --color-text-muted: #a1a1aa;
        --color-bg-body: #09090b;
        --color-bg-card: #18181b;
        --color-border: #27272a;
      }
      
      html { scroll-behavior: smooth; }
      
      body { 
        font-family: "Segoe UI", Arial, sans-serif; 
        background: var(--color-bg-body) !important; 
        color: var(--color-text-main) !important; 
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      .navbar-brand img { width:32px; height:32px; margin-right:.5rem; }

      /* ปรับเมนู Navbar ในโหมด Dark ให้สว่างคมชัด */
      .dark-mode .navbar {
        background-color: rgba(24, 24, 27, 0.92) !important;
        backdrop-filter: blur(8px);
      }
      .dark-mode .navbar-brand {
        color: #ffffff !important;
      }
      .dark-mode .nav-link {
        color: #d4d4d8 !important;
      }
      .dark-mode .nav-link:hover {
        color: var(--color-primary) !important;
      }
      .dark-mode .navbar-toggler {
        border-color: #3f3f46;
        filter: invert(1);
      }
      
      h1, h3 { 
        font-weight: 700; 
        color: var(--color-primary) !important; 
      }

      .bg-white, .bg-light, .card, footer {
        background-color: var(--color-bg-card) !important;
        color: var(--color-text-main) !important;
      }
      .dark-mode footer {
        background-color: #09090b !important;
      }
      .dark-mode .card {
        background-color: #18181b !important;
        border: 1px solid #27272a !important;
      }

      .text-muted {
        color: var(--color-text-muted) !important;
      }
      .border-bottom, .border-top, .border {
        border-color: var(--color-border) !important;
      }

      .btn-outline-primary {
        border-color: var(--color-primary);
        color: var(--color-primary);
      }
      .btn-outline-primary:hover {
        background-color: var(--color-primary);
        color: #09090b;
      }
      .dark-mode #themeToggle {
        color: #f4f4f5;
        border-color: #3f3f46;
      }
      .dark-mode #themeToggle:hover {
        background-color: #27272a;
      }

      .member-pic { width:120px; height:120px; border-radius:50%; object-fit:cover; }
      .section-gap { padding:3rem 0; }
    </style>
  </head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const toggle = document.getElementById('themeToggle');
      const body = document.body;

      if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        toggle.innerHTML = '🌙 Dark';
      }

      toggle.addEventListener('click', () => {
        if (body.classList.contains('dark-mode')) {
          body.classList.remove('dark-mode');
          localStorage.setItem('theme', 'light');
          toggle.innerHTML = '☀️ Light';
        } else {
          body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark');
          toggle.innerHTML = '🌙 Dark';
        }
      });
    </script>
